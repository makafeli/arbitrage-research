# Local development database only. No worker, signer or public HTTP service.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: arb_dev
      POSTGRES_DB: arb_dev
      POSTGRES_PASSWORD: ${ARB_DEV_DATABASE_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arb-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb_dev -d arb_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
volumes:
  arb-dev-postgres:
