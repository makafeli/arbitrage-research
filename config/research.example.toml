# Proposed configuration contract, not an implemented executable configuration.
# Synthetic research only. Empty registries intentionally provide no tradable routes.
schema_version = "0.1.0"

[deployment]
profile = "private-research"
operator_model = "single-operator"
mode = "PAPER"
on_restart = "STOPPED"

[execution]
enabled = false
signer_enabled = false
broadcast_enabled = false
flash_loans_enabled = false
live_notional_limit_minor = "0"
live_fee_budget_minor = "0"

[research]
max_hops = 2
funding_mode = "OWN_CAPITAL"
deduplicate_routes = true
require_distinct_pools = true
require_exact_protocol_math = true
require_state_provenance = true
record_rejections = true
# Set experiment sizes in verified asset base units after registry qualification.
trade_sizes_minor = []
default_starting_asset_symbol = "USDC" # Display hint only; verified address still required.

[evidence]
default_label = "CANDIDATE"
full_transaction_simulation_required_for_simulated_label = true
inclusion_scenario_required_for_estimated_executable_label = true
allow_realized_in_paper = false

[networks.base]
registry_id = "base-mainnet"
expected_evm_chain_id = 8453
enabled = false
candidate_venue = "uniswap-v3"
verified_pool_ids = []
verified_asset_ids = []
rpc_secret_reference = "UNCONFIGURED"

[networks.solana]
registry_id = "solana-mainnet"
enabled = false
candidate_venue = "orca-whirlpools"
expected_genesis_identity = "UNVERIFIED"
verified_pool_ids = []
verified_asset_ids = []
rpc_secret_reference = "UNCONFIGURED"

[resources]
# Initial lab allocations only; benchmark and validate against host capacity.
cpu_evaluation_threads = 2
maximum_queued_evaluations = 256
maximum_inflight_evaluations_per_network = 8

[storage]
database_secret_reference = "UNCONFIGURED"
critical_journal_durability = "synchronous-local-wal"
capture_directory = "./data/captures"
capture_quota_bytes = 10737418240
on_capture_quota_exceeded = "mark-experiment-incomplete-and-pause-capture"

[control]
bind_address = "127.0.0.1"
authentication_required = true
csrf_protection_required = true
command_acknowledgement = "worker-applied-fence"
