[workspace]
members = [
  "crates/arb-domain",
  "apps/control-api",
  "apps/evm-worker",
  "apps/solana-worker",
  "apps/replay",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
arb-domain = { path = "crates/arb-domain" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "net", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
