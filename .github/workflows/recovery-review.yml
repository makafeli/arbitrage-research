name: Recovery review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Docker Official Images repo-info postgres/remote/17.11.md, verified 2026-09-13.
    container: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    services:
      postgres:
        image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: recovery-test-only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: recovery-test-only
      ARB_RECOVERY_INTEGRATION: disposable-ci-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python and the pinned recovery linter
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /tmp/recovery-lint
          /tmp/recovery-lint/bin/pip install --disable-pip-version-check ruff==0.11.13
      - name: Lint recovery source and tests
        run: /tmp/recovery-lint/bin/ruff check --isolated --select E4,E7,E9,F scripts/recovery.py scripts/test_recovery.py scripts/test_recovery_postgres.py scripts/capture_audit.py scripts/test_capture_audit.py scripts/export_capture_audit.py scripts/test_export_capture_audit.py
      - name: Run capture dependency audit regressions
        run: python3 scripts/test_capture_audit.py -v
      - name: Run export-bound audit regressions
        run: python3 scripts/test_export_capture_audit.py -v
      - name: Run offline adversarial recovery tests
        run: python3 scripts/test_recovery.py -v
      - name: Restore the real migration schema and synthetic retained data
        run: python3 scripts/test_recovery_postgres.py
