name: One-shot public Base identity assessment
on:
  push:
    branches: [integrator/base-identity-29943609]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'makafeli/arbitrage-research' && github.actor == 'makafeli'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 299436099f73a4cae54d662843f1739716fec4fe
          persist-credentials: false
      - name: Validate existing observer contracts offline
        run: python3 scripts/test_inspect_pool_candidates.py -v
      - name: Inspect only the documented public 1RPC Base service
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import inspect_pool_candidates as observer
          destination = Path(os.environ['RUNNER_TEMP']) / 'base-identity'
          destination.mkdir(mode=0o700)
          client = observer.PublicRpc('base-mainnet')
          # One preselected provider, never a fallback list or retry loop.
          # Public endpoint: docs.1rpc.io/using-the-web3-api/networks (2026-09-14).
          client.endpoint = 'https://public.1rpc.io/base'
          result = observer.observe('base-mainnet', client)
          # observe's generic report defaults to PublicNode. Record the actual
          # selected endpoint, without changing any request or response bytes.
          result['endpoint'] = client.endpoint
          result['observer_source'] = '299436099f73a4cae54d662843f1739716fec4fe'
          result['workflow_source'] = os.environ['GITHUB_SHA']
          result['run_id'] = os.environ['GITHUB_RUN_ID']
          result['provider_documentation'] = 'https://docs.1rpc.io/using-the-web3-api/networks'
          result['provider_documentation_checked_on'] = '2026-09-14'
          result['qualification_scope'] = 'POINT_IN_TIME_IDENTITY_NOT_EXECUTION_OR_CAMPAIGN'
          result['paid_service_used'] = False
          for name, content in [('report.json', result), ('base-transcript.json', client.calls)]:
              (destination / name).write_text(json.dumps(content, ensure_ascii=True, indent=2) + '\n')
          (destination / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in sorted(destination.glob('*.json'))))
          print(json.dumps({'status': result['status'], 'reason': result.get('reason'),
                            'requests': len(client.calls), 'pools_observed': len(result.get('pools', [])),
                            'runtime_activation': False}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: base-identity-assessment
          path: ${{ runner.temp }}/base-identity/
          retention-days: 14
          if-no-files-found: error
