name: Initial registry evidence
on:
  pull_request:
    paths:
      - 'scripts/inspect_pool_candidates.py'
      - 'scripts/test_inspect_pool_candidates.py'
      - 'docs/27-INITIAL-REGISTRY-VERIFICATION.md'
      - 'docs/qualification-fixtures/registry-observation-2026-09-14.json'
      - '.github/workflows/registry-evidence.yml'
permissions:
  contents: read
concurrency:
  group: registry-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/test_inspect_pool_candidates.py -v
  observations:
    needs: offline
    if: github.event.action == 'opened' && github.actor == 'makafeli' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect bounded public read-only observations without retries or secrets
        run: |
          python3 scripts/inspect_pool_candidates.py --collect --output "$RUNNER_TEMP/registry-observation"
          git rev-parse HEAD > "$RUNNER_TEMP/registry-observation/SOURCE_COMMIT"
          cd "$RUNNER_TEMP/registry-observation"
          sha256sum ./*.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registry-observation
          path: ${{ runner.temp }}/registry-observation/
          retention-days: 30
          if-no-files-found: error
