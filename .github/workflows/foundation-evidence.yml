name: Foundation acceptance evidence
on:
  pull_request:
    paths:
      - 'docs/qualification-fixtures/probe_qualification.py'
      - 'docs/qualification-fixtures/test_probe_qualification.py'
      - 'docs/qualification-fixtures/probe_public_rpc.py'
      - 'docs/qualification-fixtures/feasibility-2026-09-14.json'
      - 'docs/benchmark-environment.json'
      - 'docs/26-FOUNDATION-CLOSEOUT.md'
      - '.github/workflows/foundation-evidence.yml'
concurrency:
  group: foundation-evidence-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 docs/qualification-fixtures/test_probe_qualification.py -v
  public-feasibility-sample:
    if: github.event.action == 'opened' && github.actor == 'makafeli' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect at most 24 public read-only requests, no account or secrets
        run: |
          mkdir -p /tmp/provider-feasibility
          python3 docs/qualification-fixtures/probe_qualification.py --run-public-probe --output /tmp/provider-feasibility/report.json
          sha256sum /tmp/provider-feasibility/report.json > /tmp/provider-feasibility/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-feasibility
          path: /tmp/provider-feasibility/
          retention-days: 30
          if-no-files-found: error
