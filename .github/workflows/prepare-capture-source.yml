name: Prepare exact Base producer integration source
on:
  push:
    branches: [feat/ARB-018-producer-capture-source]
permissions:
  contents: write
concurrency:
  group: prepare-arb018-capture-source
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'makafeli/arbitrage-research' && github.actor == 'makafeli'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install the repository-pinned formatter
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Apply exact scoped edits and publish Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_capture_source.py
