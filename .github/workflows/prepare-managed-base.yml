name: Publish exact locally tested managed Base source
on:
  push:
    branches: [feat/ARB-044-managed-base-worker]
    paths: [.github/workflows/prepare-managed-base.yml, .managed-base-patch-1.b64, .managed-base-patch-2.b64]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'makafeli/arbitrage-research' && github.actor == 'makafeli'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify exact source, apply tested patch and publish only owned feature
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          branch='feat/ARB-044-managed-base-worker'
          base='72b1dfab65d1d1ccb8e53bf5565b6ac1ca3dc1c0'
          base_tree='7323909c2235ee20eda893fd7853de1718db739e'
          expected='c66d2c5c90e4495601ee83c16068448b84fbb030'
          helpers=['.github/workflows/prepare-managed-base.yml','.managed-base-patch-1.b64','.managed-base-patch-2.b64']
          allowed={'GOAL.md','apps/research-worker/README.md','apps/research-worker/src/main.rs','apps/research-worker/src/managed_ingestion.rs','apps/research-worker/tests/controlled_capture.rs','apps/research-worker/tests/support/managed_ingestion_process.rs','crates/arb-evm/src/backfill.rs','crates/arb-evm/tests/backfill.rs','docs/MANAGED-BASE-WORKER.md','planning/implementation-progress.json'}
          def git(*args):
              return subprocess.check_output(['git',*args],text=True,timeout=30).strip()
          def remote(ref):
              lines=git('ls-remote','--exit-code','origin',ref).splitlines()
              assert len(lines)==1
              sha,name=lines[0].split()
              assert name==ref
              return sha
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert remote('refs/heads/main')==base
          assert remote('refs/heads/'+branch)==os.environ['GITHUB_SHA']
          packed=''.join(pathlib.Path(p).read_text() for p in helpers[1:])
          patch=zlib.decompress(base64.b64decode(packed,validate=True))
          assert len(patch)==58747
          assert hashlib.sha256(patch).hexdigest()=='d0d2c01e16438a73813031330527276ffc9424f52ea497a00d6f62e361ee5c9a'
          assert {line.split()[2][2:].decode() for line in patch.splitlines() if line.startswith(b'diff --git ')}==allowed
          git('rm','--',*helpers)
          assert git('write-tree')==base_tree
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero','--whitespace=error-all','-'],input=patch,check=True,timeout=30)
          assert git('write-tree')==expected
          git('diff','--cached','--check')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','Integrate opt-in exact-target Base ingestion in the research worker','-m','Exact local source tree verified before publication. Preserve original source, request, control and acceptance limits. No provider requests, hosted activation or trading. Temporary publication files removed.')
          assert git('rev-parse','HEAD^{tree}')==expected
          assert remote('refs/heads/main')==base
          assert remote('refs/heads/'+branch)==os.environ['GITHUB_SHA']
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Published exact reviewed local tree',expected,'on',branch,'only; native PR CI and review still required.')
          PY
