name: Set up repository planning
on:
  push:
    branches: [main]
    paths:
      - planning/backlog.json
      - scripts/github_bootstrap.py
      - .github/workflows/repository-setup.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: repository-planning-setup
  cancel-in-progress: false
jobs:
  import-planning:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate the importer without credentials
        run: python scripts/test_github_bootstrap.py
      - name: Validate intended changes
        run: python scripts/github_bootstrap.py --repo "$GITHUB_REPOSITORY" --dry-run --components labels,milestones,issues,relationships
      - name: Restore the last retained planning progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prior_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=setup-progress&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -n "$prior_run" ]; then
            gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" --name setup-progress --dir restored-setup
            cp restored-setup/setup-state.json setup-state.json
          fi
      - name: Apply repository planning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_bootstrap.py --repo "$GITHUB_REPOSITORY" --apply --components labels,milestones,issues,relationships --state setup-state.json
      - name: Summarize actual phase results
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = Path('setup-state.json')
          lines = ['## Repository planning setup', '']
          if state.exists():
              result = json.loads(state.read_text())
              for name, phase in result.get('phases', {}).items():
                  lines.append(f"- {name}: **{phase['status']}**")
              lines.append(f"- Discovered imported issue markers: {len(result.get('issues', {}))}")
              if result.get('pending'):
                  lines.append('- Uncertain creates remain. Download setup-progress before rerunning; do not blindly retry creation.')
          else:
              lines.append('Setup did not reach a recorded remote phase.')
          lines += ['', 'Native owner Project and Wiki publishing use the separate authenticated CLI phase in scripts/README.md.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(lines) + '\n')
          PY
      - name: Retain progress and issue URLs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup-progress
          path: setup-state.json
          if-no-files-found: ignore
          retention-days: 30
