name: Prepare Rust review artifacts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install the repository's pinned Rust toolchain
        run: rustup show
      - name: Prepare the independent reference dependency lock and fixtures
        if: hashFiles('crates/arb-evm/tests/reference/package.json') != ''
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix crates/arb-evm/tests/reference
          npm ci --ignore-scripts --no-audit --no-fund --prefix crates/arb-evm/tests/reference
          npm view @uniswap/v3-sdk@3.11.0 --json > crates/arb-evm/tests/reference/package-provenance.json
          node crates/arb-evm/tests/reference/generate.cjs --write
          node crates/arb-evm/tests/reference/generate.cjs --check
      - name: Resolve workspace changes while preserving compatible locked versions
        if: always()
        run: cargo metadata --format-version 1 > /dev/null
      - name: Prepare Rust formatting for manual review
        if: always()
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > rust-format.patch
      - name: Emit review artifacts as checksummed base64 chunks
        if: always()
        run: python scripts/emit_review_artifacts.py
      - name: Preserve generated files for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-rust-review
          path: |
            Cargo.lock
            rust-format.patch
            crates/arb-evm/tests/reference/package-lock.json
            crates/arb-evm/tests/reference/golden.json
            crates/arb-evm/tests/reference/package-provenance.json
          if-no-files-found: warn
          retention-days: 7
