name: Comparison review
on:
  pull_request:
    paths:
      - 'scripts/comparison_cohorts.py'
      - 'scripts/test_comparison_cohorts.py'
      - 'scripts/comparison_holdout.py'
      - 'scripts/test_comparison_holdout.py'
      - 'docs/24-COMPARISON-COHORTS.md'
      - '.github/workflows/comparison-review.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comparison-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comparison:
    name: comparison (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [cohorts, holdout]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.13'
      - name: Compile comparison and partition modules
        run: python -m py_compile scripts/comparison_cohorts.py scripts/test_comparison_cohorts.py scripts/comparison_holdout.py scripts/test_comparison_holdout.py
      - name: Run independent deterministic and adversarial suite
        run: python scripts/test_comparison_${{ matrix.suite }}.py -v
