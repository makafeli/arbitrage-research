name: Delivery review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Archive only the committed review source
        run: |
          mkdir -p delivery-artifacts
          git rev-parse HEAD > delivery-artifacts/SOURCE_COMMIT
          git archive --format=tar HEAD | gzip -n > delivery-artifacts/source.tar.gz
          cd delivery-artifacts
          sha256sum source.tar.gz > SHA256SUMS
      - name: Preserve exact source for reproducible review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-review
          path: delivery-artifacts/
          if-no-files-found: error
          retention-days: 7
