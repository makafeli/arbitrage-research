name: Recorded Base observation slice
on:
  workflow_dispatch:
  push:
    branches: [feat/ARB-015-recorded-slice]
  pull_request:
    paths:
      - 'scripts/recorded_base_slice.py'
      - 'scripts/test_recorded_base_slice.py'
      - 'scripts/collect_operator_base_evidence.py'
      - 'scripts/inspect_pool_candidates.py'
      - 'apps/web/scripts/recorded-slice-browser.mjs'
      - '.github/workflows/recorded-base-slice.yml'
      - 'docs/RECORDED-BASE-SLICE.md'
permissions:
  contents: read
concurrency:
  group: recorded-base-slice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/test_recorded_base_slice.py -v
      - run: python3 scripts/test_operator_base_evidence.py -v
      - run: python3 scripts/test_inspect_pool_candidates.py -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node --check apps/web/scripts/recorded-slice-browser.mjs
  recorded:
    needs: offline
    if: >-
      github.repository == 'makafeli/arbitrage-research' && github.actor == 'makafeli' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/ARB-015-recorded-slice' &&
      github.event.head_commit.message == 'Run recorded Base slice once'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: arb_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: arb_recorded_slice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arb_test -d arb_recorded_slice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Build the unchanged research binaries and real dashboard without provider secrets
        run: |
          cargo build --locked -p control-api -p research-worker -p replay
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          cd apps/web
          npx playwright install --with-deps chromium
      - name: Run one bounded read-only recorded experiment
        id: experiment
        env:
          ARB_BASE_RPC_URL: ${{ secrets.ARB_BASE_RPC_URL }}
          TEST_DATABASE_URL: postgres://arb_test:isolated-test-only@127.0.0.1:5432/arb_recorded_slice
        run: |
          result=0
          python3 scripts/recorded_base_slice.py --run --output "$RUNNER_TEMP/recorded-slice" || result=$?
          if [ -f "$RUNNER_TEMP/recorded-slice/evidence/EXPORT_READY" ]; then
            echo 'export_ready=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.experiment.outputs.export_ready == 'true'
        with:
          name: recorded-base-slice-evidence
          path: ${{ runner.temp }}/recorded-slice/evidence/
          retention-days: 30
          if-no-files-found: error
