name: Archive completed ingestion helper and remove merged branches
on:
  push:
    branches: [integrator/arb016-durable-source]
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.repository == 'makafeli/arbitrage-research' && github.actor == 'makafeli'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify both merges, archive the helper, then remove only owned unchanged refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          repo='repos/makafeli/arbitrage-research'
          def get(path):
              return json.loads(subprocess.check_output(['gh','api',repo+path],text=True))
          def post(path,payload):
              result=subprocess.run(['gh','api','--method','POST',repo+path,'--input','-'],input=json.dumps(payload),text=True,capture_output=True,check=True)
              return json.loads(result.stdout)
          current=os.environ['GITHUB_SHA']
          helper='integrator/arb016-durable-source'
          assert get('/git/commits/'+current)['parents'][0]['sha']=='3d70602671ab11cef1e75f4144cecd2dcd8a834c'
          targets=[]
          for number,branch,head,tree in [
              (132,'feat/ARB-016-durable-ingestion','03288a7832ae04a5351a6b4a255ecc2c46c84ef4','dbb1be4111f7efc96debee60b610be76bca336b5'),
              (133,'fix/ARB-016-graceful-process-stop','09afef23a90c12d42bdc1663ca16fea4b3b4ddac','93bdb253618a270a12ded8388b00b3c9344419db')
          ]:
              pr=get('/pulls/'+str(number))
              assert pr['merged'] and pr['state']=='closed' and pr['head']['sha']==head
              assert get('/git/commits/'+pr['merge_commit_sha'])['tree']['sha']==tree
              targets.append((branch,head))
          targets.append((helper,current))
          # Check the full deletion set before creating the archive or deleting.
          for name,sha in targets:
              assert name != 'main'
              assert get('/git/ref/heads/'+name)['object']['sha']==sha
              assert not get('/pulls?state=open&head=makafeli:'+name)
          tag='archive/arb016-durable-source-2026-09-15'
          assert not get('/git/matching-refs/tags/'+tag)
          archived=post('/git/refs',{'ref':'refs/tags/'+tag,'sha':current})
          assert archived['object']['sha']==current
          assert get('/git/ref/tags/'+tag)['object']['sha']==current
          for name,sha in targets:
              assert get('/git/ref/heads/'+name)['object']['sha']==sha
              subprocess.run(['gh','api','--method','DELETE',repo+'/git/refs/heads/'+name],check=True)
          print(json.dumps({'removed':[name for name,_ in targets],'archive':tag,'main_modified':False}))
          PYTHON
