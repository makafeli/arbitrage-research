name: Codex team review
on:
  pull_request:
    paths:
      - '.codex/**'
      - 'scripts/start_codex_team.py'
      - 'scripts/test_codex_team.py'
      - 'docs/CODEX-TEAM.md'
      - '.github/workflows/codex-team-review.yml'
  push:
    branches: [main]
    paths:
      - '.codex/**'
      - 'scripts/start_codex_team.py'
      - 'scripts/test_codex_team.py'
      - 'docs/CODEX-TEAM.md'
      - '.github/workflows/codex-team-review.yml'
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.13'
      - name: Validate configuration without starting an agent
        run: python scripts/start_codex_team.py
      - name: Test launcher and refusal behavior with local test doubles
        run: python scripts/test_codex_team.py -v
