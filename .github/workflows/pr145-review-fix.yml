name: Prepare PR145 review corrections
on:
  push:
    branches: ['fix/ARB-044-worker-deploy-gate']
    paths: ['.github/workflows/pr145-review-fix.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'makafeli/arbitrage-research'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Reproduce exact locally tested tree using the corrected preparation recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == '07e47007f75e553927e33857998019ce4721750e'
          # The fixed recipe is our own immediately preceding source, not remote input.
          raw = subprocess.check_output(['git', 'show', parent + ':.github/workflows/pr145-review-fix.yml'], text=True)
          lines = raw.splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = len(lines) - 1
          assert lines[end] == '          PY'
          assert all(line.startswith('          ') for line in lines[start:end])
          code = '\n'.join(line[10:] for line in lines[start:end]) + '\n'
          # YAML already removes the outer ten-space indentation.
          code = code.replace(r".replace('\n          ', '\n')", '')
          code = code.replace("git('rev-parse', 'HEAD^')", "git('rev-parse', 'HEAD^^')")
          exec(compile(code, '<reviewed-pr145-preparation>', 'exec'))
          PY
