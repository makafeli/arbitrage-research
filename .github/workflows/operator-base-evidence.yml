name: Operator Base identity evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/collect_operator_base_evidence.py'
      - 'scripts/test_operator_base_evidence.py'
      - 'scripts/inspect_pool_candidates.py'
      - 'scripts/test_inspect_pool_candidates.py'
      - '.github/workflows/operator-base-evidence.yml'
      - 'docs/EPIC-01-HANDOFF.md'
permissions:
  contents: read
concurrency:
  group: operator-base-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the operator wrapper and unchanged observer without provider access
        run: |
          python3 scripts/test_operator_base_evidence.py -v
          python3 scripts/test_inspect_pool_candidates.py -v
  collect:
    needs: offline
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'makafeli/arbitrage-research' &&
      github.actor == 'makafeli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect through the existing authorized endpoint, never a public fallback
        id: collect
        env:
          ARB_BASE_RPC_URL: ${{ secrets.ARB_BASE_RPC_URL }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/base-evidence"
          if python3 scripts/collect_operator_base_evidence.py --collect --output "$RUNNER_TEMP/base-evidence/report.json"; then
            result=0
          else
            result=$?
          fi
          if [ -s "$RUNNER_TEMP/base-evidence/report.json" ]; then
            python3 -m json.tool "$RUNNER_TEMP/base-evidence/report.json" >/dev/null
            git rev-parse HEAD > "$RUNNER_TEMP/base-evidence/SOURCE_COMMIT"
            cd "$RUNNER_TEMP/base-evidence"
            sha256sum report.json SOURCE_COMMIT > SHA256SUMS
            echo 'report_written=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.collect.outputs.report_written == 'true'
        with:
          name: operator-base-identity-summary
          path: ${{ runner.temp }}/base-evidence/
          retention-days: 30
          if-no-files-found: error
