name: Scoped delivery task
description: Add an implementable task with acceptance and verification.
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement, epic and milestone
      placeholder: PRD-Fxx / EPIC-xx / Mx
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Problem and intended outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Implementation scope and interfaces
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and verification evidence
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Prerequisites, risk and release gate
      description: Link blockers. Changes that enable live execution need the M6/M7 review and operator gate.
