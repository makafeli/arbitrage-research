name: Bug or incorrect research result
description: Report reproducible behavior, evidence errors or operator control failures.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Include mode, chain, build revision, relevant evidence label and timestamps. Never include keys or RPC credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and supporting evidence
      description: Provide a sanitized fixture or sequence of steps. Distinguish synthetic, paper and actual chain evidence.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Scope and recovery
      description: Describe affected sessions, unknown outcomes and current observed state.
