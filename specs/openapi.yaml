openapi: 3.1.0
info:
  title: Arbitrage Research Control API
  version: 0.4.0
  description: 'Implemented private research control boundary. Authentication, immutable configuration
    references, durable session intent, command receipts, admitted decision history and immutable virtual
    portfolios are supported. The API does not collect market data, sign or broadcast. Read results retain
    explicit provenance and missing-cost states. A 202 response proves durable command acceptance only; worker application
    must be observed separately. All amounts and revisions use strings. The service has 16 KiB request
    bodies, 10 login attempts per minute globally, at most 8 operator sessions, and 300 authenticated
    requests per minute per session. A reverse proxy provides HTTPS outside explicit loopback development.
    At most 64 handler requests run concurrently; each has a 15-second deadline. A timeout can leave mutation
    completion uncertain: retry with the same idempotency key and payload.'
servers:
- url: https://arb.example.invalid
  description: Nonfunctional placeholder; no service is deployed.
security:
- operatorSession: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Authenticated database readiness. This does not assert worker, provider or execution
            readiness. The separate unauthenticated /healthz is process liveness only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    enum:
                    - OK
                    - DEGRADED
                  version:
                    type: string
                required:
                - status
                - version
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': &id002
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '429': &id001
          description: Request rejected; stable redacted error with correlation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/sessions:
    post:
      operationId: createSession
      description: Creates a RECOVERING immutable-mode research session. The worker reconciles state and
        transitions it to STOPPED; creating a session never starts research or arms execution. Configuration
        digest must match a server-registered validated configuration, including enabled network, mode
        and strategy allowlist. Identical idempotent requests return the original session; a changed payload
        returns 409. LIVE returns 403.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': &id003
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id002
        '403': &id004
          description: Capability or policy denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '409': &id005
          description: Revision conflict or incompatible lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '503': &id006
          description: Required control dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
    get:
      operationId: listSessions
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/sessions/{session_id}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      responses:
        '200':
          description: Observed status including unresolved attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '404':
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/sessions/{session_id}/commands:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: issueCommand
      description: Durably accepts a revisioned command. Same idempotency key and payload returns original
        receipt; different payload returns 409. PENDING is not an effective stop. APPLIED STOP fences
        future local broadcasts; previously emitted requests may execute and the state may remain DRAINING.
        DISARM is idempotent and never recalls a transaction. APPLIED DISARM additionally requires a durable
        signer revocation acknowledgement; an in-flight sign may return bytes that must remain quarantined.
        DISARM is reserved for LIVE sessions and returns 403 in the research-only deployment. All-worker
        controls fan out per-session commands and retain individual acknowledgements.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Durably accepted; poll receipt and session for application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: Requested resource was not found in the operator scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/commands/{command_id}:
    parameters:
    - name: command_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getCommand
      responses:
        '200':
          description: Command receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '404':
          description: Unknown command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/opportunities:
    get:
      operationId: listOpportunities
      description: Projects persisted QUOTED decisions as evidence-labelled records. Filtering runs before
        pagination; rejected or missing-input rows cannot consume eligible page slots. Source provenance
        remains explicit. Version 1.1 reports net as null when external costs are incomplete. A supplied
        session must belong to the operator. No worker/provider readiness is inferred by this read.
      parameters:
      - name: session_id
        in: query
        schema:
          type: string
      - name: network_id
        in: query
        schema: &id007
          type: string
          enum:
          - base-mainnet
          - solana-mainnet
      - name: evidence_label
        in: query
        schema:
          type: string
          enum:
          - CANDIDATE
          - SIMULATED
          - ESTIMATED_EXECUTABLE
          - REALIZED
      - name: source_kind
        in: query
        schema:
          enum: [SYNTHETIC_FIXTURE, CAPTURED_MARKET_DATA]
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Opportunity page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opportunity'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: Requested resource was not found in the operator scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login:
    post:
      operationId: login
      security: []
      description: Exchange a process-provisioned operator secret for a new cookie and in-memory CSRF
        token. Never save the supplied secret or CSRF token to browser storage. Global login rate limit
        includes failed attempts.
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; Set-Cookie establishes operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id001
        '401': *id001
        '403': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/auth/session:
    get:
      operationId: getOperatorSession
      description: Restore an existing cookie-authenticated browser session after a page reload. CSRF
        token is retained only in browser memory.
      responses:
        '200':
          description: Active operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Server-side session revoked and cookie expired.
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id001
        '403': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/capabilities:
    get:
      operationId: getCapabilities
      description: Reports implemented capabilities and safe server-registered configuration choices.
        Contains no RPC endpoints, configuration snapshots or credentials. Enabled network configuration
        is structural validation, not provider readiness.
      responses:
        '200':
          description: Capabilities and permitted configuration choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
