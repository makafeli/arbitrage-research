components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: arb_session
      description: Opaque random token in a bounded, expiring server-side operator session. Secure, HttpOnly,
        SameSite=Strict, Path=/. Secure is omitted only under explicit HTTP loopback development configuration.
        Authentication restart invalidates all browser sessions. Mutations require exact configured Origin
        and X-CSRF-Token. No CORS origins are granted.
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]{16,128}$
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Must exactly match ARB_PUBLIC_ORIGIN; missing, duplicate and null origins are rejected.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    Session:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
        network_id: *id007
        mode: &id009
          type: string
          enum:
          - OBSERVE
          - PAPER
          - REPLAY
          - LIVE
        observed_state:
          type: string
          enum:
          - RECOVERING
          - STOPPED
          - RUNNING
          - PAUSING
          - PAUSED
          - DRAINING
          - FAULTED
        health:
          enum:
          - HEALTHY
          - DEGRADED
          - UNREACHABLE
          - UNKNOWN
        desired_revision: &id008
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        applied_revision: *id008
        outstanding_attempts:
          type: integer
          minimum: 0
        execution_authorized:
          type: boolean
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
        configuration_digest:
          type: string
      required:
      - session_id
      - network_id
      - mode
      - observed_state
      - health
      - desired_revision
      - applied_revision
      - outstanding_attempts
      - execution_authorized
      - last_heartbeat_at
      - configuration_digest
    CommandRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          enum:
          - START
          - PAUSE
          - RESUME
          - STOP
          - DISARM
        expected_revision: *id008
        reason:
          type: string
          maxLength: 500
      required:
      - action
      - expected_revision
    CommandReceipt:
      type: object
      additionalProperties: false
      properties:
        command_id:
          type: string
        session_id:
          type: string
        revision: *id008
        status:
          enum:
          - PENDING
          - APPLIED
          - REJECTED
          - SUPERSEDED
        action:
          enum:
          - START
          - PAUSE
          - RESUME
          - STOP
          - DISARM
        accepted_at:
          type: string
          format: date-time
        applied_at:
          type:
          - string
          - 'null'
          format: date-time
        outstanding_attempts:
          type: integer
          minimum: 0
        fence_effective:
          type: boolean
        signer_revocation_status:
          type: string
          enum:
          - NOT_APPLICABLE
          - PENDING
          - ACKNOWLEDGED
      required:
      - command_id
      - session_id
      - revision
      - status
      - action
      - accepted_at
      - applied_at
      - outstanding_attempts
      - fence_effective
      - signer_revocation_status
      description: APPLIED STOP/PAUSE means worker fence effective. APPLIED DISARM also requires durable
        signer epoch revocation acknowledgement; unreachable signer retains PENDING command status.
    Opportunity:
      $ref: ./opportunity.schema.json
    CreateSession:
      type: object
      additionalProperties: false
      properties:
        network_id: *id007
        mode: *id009
        configuration_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        experiment_id:
          type: string
          minLength: 1
          maxLength: 128
        strategy_ids:
          type: array
          minItems: 1
          items:
            type: string
          maxItems: 16
      required:
      - network_id
      - mode
      - configuration_digest
      - experiment_id
      - strategy_ids
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        operator_id:
          const: operator
        csrf_token:
          type: string
          pattern: ^[0-9a-f]{64}$
        expires_at:
          type: string
          pattern: ^[0-9]+$
          description: Unix epoch seconds, encoded as a decimal string.
      required:
      - operator_id
      - csrf_token
      - expires_at
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        operator_secret:
          type: string
          minLength: 32
          maxLength: 1024
          writeOnly: true
      required:
      - operator_secret
    RegisteredConfiguration:
      type: object
      additionalProperties: false
      properties:
        configuration_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        mode:
          enum:
          - OBSERVE
          - PAPER
          - REPLAY
        enabled_networks:
          type: array
          items:
            enum:
            - base-mainnet
            - solana-mainnet
        strategy_ids:
          type: array
          items:
            type: string
        paper_assets:
          type: array
          items:
            $ref: '#/components/schemas/PaperAssetChoice'
      required:
      - configuration_digest
      - mode
      - enabled_networks
      - strategy_ids
      - paper_assets
