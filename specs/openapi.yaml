openapi: 3.1.0
info:
  title: Arbitrage Research Control API
  version: 0.1.0
  description: PROPOSED DESIGN ONLY. Private authenticated control plane. Initial
    deployment is OBSERVE/PAPER/REPLAY without signing or broadcast. LIVE is a reserved
    capability-gated mode; no live arming endpoint is supplied. All integer quantities
    and revisions crossing JSON use strings. A 202 command response acknowledges durable
    acceptance only, not worker application.
servers:
- url: https://arb.example.invalid
  description: Nonfunctional placeholder; no service is deployed.
security:
- operatorSession: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Minimal service health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    enum:
                    - OK
                    - DEGRADED
                  version:
                    type: string
                required:
                - status
                - version
        '401': &id001
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions:
    post:
      operationId: createSession
      description: Creates a STOPPED immutable-mode session after required recovery.
        Does not start workers or arm execution. LIVE returns 403 in the first deployment.
        Idempotency keys deduplicate identical requests.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': &id002
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': &id003
          description: Capability or policy denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id004
          description: Revision conflict or incompatible lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id005
          description: Required control dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listSessions
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
        '400': *id002
        '401': *id001
        '403': *id003
        '409': *id004
        '503': *id005
  /v1/sessions/{session_id}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      responses:
        '200':
          description: Observed status including unresolved attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': *id002
        '401': *id001
        '403': *id003
        '409': *id004
        '503': *id005
  /v1/sessions/{session_id}/commands:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: issueCommand
      description: Durably accepts a revisioned command. Same idempotency key and
        payload returns original receipt; different payload returns 409. PENDING is
        not an effective stop. APPLIED STOP fences future local broadcasts; previously
        emitted requests may execute and the state may remain DRAINING. DISARM is
        idempotent and never recalls a transaction. APPLIED DISARM additionally requires
        a durable signer revocation acknowledgement; an in-flight sign may return
        bytes that must remain quarantined. DISARM is reserved for LIVE sessions and
        returns 403 in the research-only deployment. All-worker controls fan out per-session
        commands and retain individual acknowledgements.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Durably accepted; poll receipt and session for application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': *id002
        '401': *id001
        '403': *id003
        '409': *id004
        '503': *id005
  /v1/commands/{command_id}:
    parameters:
    - name: command_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getCommand
      responses:
        '200':
          description: Command receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '404':
          description: Unknown command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': *id002
        '401': *id001
        '403': *id003
        '409': *id004
        '503': *id005
  /v1/opportunities:
    get:
      operationId: listOpportunities
      description: Evidence-labelled records. Schema includes financial fields; server
        validates exact arithmetic, asset registry, route continuity, network identity
        and evidence consistency.
      parameters:
      - name: session_id
        in: query
        schema:
          type: string
      - name: network_id
        in: query
        schema: &id006
          type: string
          enum:
          - base-mainnet
          - solana-mainnet
      - name: evidence_label
        in: query
        schema:
          type: string
          enum:
          - CANDIDATE
          - SIMULATED
          - ESTIMATED_EXECUTABLE
          - REALIZED
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Opportunity page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opportunity'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
        '400': *id002
        '401': *id001
        '403': *id003
        '409': *id004
        '503': *id005
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: arb_session
      description: Server-side operator session; Secure, HttpOnly, SameSite=Strict.
        Validate CSRF token and origin on mutations.
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    Session:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
        network_id: *id006
        mode: &id008
          type: string
          enum:
          - OBSERVE
          - PAPER
          - REPLAY
          - LIVE
        observed_state:
          type: string
          enum:
          - RECOVERING
          - STOPPED
          - RUNNING
          - PAUSING
          - PAUSED
          - DRAINING
          - FAULTED
        health:
          enum:
          - HEALTHY
          - DEGRADED
          - UNREACHABLE
          - UNKNOWN
        desired_revision: &id007
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        applied_revision: *id007
        outstanding_attempts:
          type: integer
          minimum: 0
        execution_authorized:
          type: boolean
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
        configuration_digest:
          type: string
      required:
      - session_id
      - network_id
      - mode
      - observed_state
      - health
      - desired_revision
      - applied_revision
      - outstanding_attempts
      - execution_authorized
      - last_heartbeat_at
      - configuration_digest
    CommandRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          enum:
          - START
          - PAUSE
          - RESUME
          - STOP
          - DISARM
        expected_revision: *id007
        reason:
          type: string
          maxLength: 500
      required:
      - action
      - expected_revision
    CommandReceipt:
      type: object
      additionalProperties: false
      properties:
        command_id:
          type: string
        session_id:
          type: string
        revision: *id007
        status:
          enum:
          - PENDING
          - APPLIED
          - REJECTED
          - SUPERSEDED
        action:
          enum:
          - START
          - PAUSE
          - RESUME
          - STOP
          - DISARM
        accepted_at:
          type: string
          format: date-time
        applied_at:
          type:
          - string
          - 'null'
          format: date-time
        outstanding_attempts:
          type: integer
          minimum: 0
        fence_effective:
          type: boolean
        signer_revocation_status:
          type: string
          enum:
          - NOT_APPLICABLE
          - PENDING
          - ACKNOWLEDGED
      required:
      - command_id
      - session_id
      - revision
      - status
      - action
      - accepted_at
      - applied_at
      - outstanding_attempts
      - fence_effective
      - signer_revocation_status
      description: APPLIED STOP/PAUSE means worker fence effective. APPLIED DISARM
        also requires durable signer epoch revocation acknowledgement; unreachable
        signer retains PENDING command status.
    Opportunity:
      $ref: ./opportunity.schema.json
    CreateSession:
      type: object
      additionalProperties: false
      properties:
        network_id: *id006
        mode: *id008
        configuration_digest:
          type: string
        experiment_id:
          type: string
        strategy_ids:
          type: array
          minItems: 1
          items:
            type: string
      required:
      - network_id
      - mode
      - configuration_digest
      - experiment_id
      - strategy_ids
