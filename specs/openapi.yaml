openapi: 3.1.0
info:
  title: Arbitrage Research Control API
  version: 0.3.0
  description: 'Implemented private research control boundary. Authentication, immutable configuration
    references, durable session intent and command receipts are supported. Market capture, signing and
    broadcast are unavailable. A 202 response proves durable command acceptance only; worker application
    must be observed separately. All amounts and revisions use strings. The service has 16 KiB request
    bodies, 10 login attempts per minute globally, at most 8 operator sessions, and 300 authenticated
    requests per minute per session. A reverse proxy provides HTTPS outside explicit loopback development.
    At most 64 handler requests run concurrently; each has a 15-second deadline. A timeout can leave mutation
    completion uncertain: retry with the same idempotency key and payload.'
servers:
- url: https://arb.example.invalid
  description: Nonfunctional placeholder; no service is deployed.
security:
- operatorSession: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Authenticated database readiness. This does not assert worker, provider or execution
            readiness. The separate unauthenticated /healthz is process liveness only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    enum:
                    - OK
                    - DEGRADED
                  version:
                    type: string
                required:
                - status
                - version
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': &id002
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '429': &id001
          description: Request rejected; stable redacted error with correlation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/sessions:
    post:
      operationId: createSession
      description: Creates a RECOVERING immutable-mode research session. The worker reconciles state and
        transitions it to STOPPED; creating a session never starts research or arms execution. Configuration
        digest must match a server-registered validated configuration, including enabled network, mode
        and strategy allowlist. Identical idempotent requests return the original session; a changed payload
        returns 409. LIVE returns 403.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': &id003
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id002
        '403': &id004
          description: Capability or policy denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '409': &id005
          description: Revision conflict or incompatible lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '503': &id006
          description: Required control dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
    get:
      operationId: listSessions
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/sessions/{session_id}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      responses:
        '200':
          description: Observed status including unresolved attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '404':
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/sessions/{session_id}/commands:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: issueCommand
      description: Durably accepts a revisioned command. Same idempotency key and payload returns original
        receipt; different payload returns 409. PENDING is not an effective stop. APPLIED STOP fences
        future local broadcasts; previously emitted requests may execute and the state may remain DRAINING.
        DISARM is idempotent and never recalls a transaction. APPLIED DISARM additionally requires a durable
        signer revocation acknowledgement; an in-flight sign may return bytes that must remain quarantined.
        DISARM is reserved for LIVE sessions and returns 403 in the research-only deployment. All-worker
        controls fan out per-session commands and retain individual acknowledgements.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Durably accepted; poll receipt and session for application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: Requested resource was not found in the operator scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/commands/{command_id}:
    parameters:
    - name: command_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getCommand
      responses:
        '200':
          description: Command receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '404':
          description: Unknown command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/opportunities:
    get:
      operationId: listOpportunities
      description: Evidence-labelled records. This release has no capture provider and returns an empty
        page. The capability endpoint explicitly reports opportunity_capture=false. No synthetic fixtures
        are substituted into connected mode. Filters are validated; a supplied session_id must belong
        to the operator.
      parameters:
      - name: session_id
        in: query
        schema:
          type: string
      - name: network_id
        in: query
        schema: &id007
          type: string
          enum:
          - base-mainnet
          - solana-mainnet
      - name: evidence_label
        in: query
        schema:
          type: string
          enum:
          - CANDIDATE
          - SIMULATED
          - ESTIMATED_EXECUTABLE
          - REALIZED
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Opportunity page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opportunity'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id003
        '401': *id002
        '403': *id004
        '409': *id005
        '503': *id006
        '429': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: Requested resource was not found in the operator scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login:
    post:
      operationId: login
      security: []
      description: Exchange a process-provisioned operator secret for a new cookie and in-memory CSRF
        token. Never save the supplied secret or CSRF token to browser storage. Global login rate limit
        includes failed attempts.
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; Set-Cookie establishes operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '400': *id001
        '401': *id001
        '403': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/auth/session:
    get:
      operationId: getOperatorSession
      description: Restore an existing cookie-authenticated browser session after a page reload. CSRF
        token is retained only in browser memory.
      responses:
        '200':
          description: Active operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Server-side session revoked and cookie expired.
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id001
        '403': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
  /v1/capabilities:
    get:
      operationId: getCapabilities
      description: Reports implemented capabilities and safe server-registered configuration choices.
        Contains no RPC endpoints, configuration snapshots or credentials. Enabled network configuration
        is structural validation, not provider readiness.
      responses:
        '200':
          description: Capabilities and permitted configuration choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          headers:
            X-Request-ID:
              description: Server-generated request correlation ID. Also present in error JSON.
              schema:
                type: string
        '401': *id001
        '429': *id001
        '503': *id001
        '504':
          description: Request deadline reached. Mutation completion may be uncertain; retry with the
            same idempotency key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: arb_session
      description: Opaque random token in a bounded, expiring server-side operator session. Secure, HttpOnly,
        SameSite=Strict, Path=/. Secure is omitted only under explicit HTTP loopback development configuration.
        Authentication restart invalidates all browser sessions. Mutations require exact configured Origin
        and X-CSRF-Token. No CORS origins are granted.
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]{16,128}$
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Must exactly match ARB_PUBLIC_ORIGIN; missing, duplicate and null origins are rejected.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    Session:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
        network_id: *id007
        mode: &id009
          type: string
          enum:
          - OBSERVE
          - PAPER
          - REPLAY
          - LIVE
        observed_state:
          type: string
          enum:
          - RECOVERING
          - STOPPED
          - RUNNING
          - PAUSING
          - PAUSED
          - DRAINING
          - FAULTED
        health:
          enum:
          - HEALTHY
          - DEGRADED
          - UNREACHABLE
          - UNKNOWN
        desired_revision: &id008
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        applied_revision: *id008
        outstanding_attempts:
          type: integer
          minimum: 0
        execution_authorized:
          type: boolean
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
        configuration_digest:
          type: string
      required:
      - session_id
      - network_id
      - mode
      - observed_state
      - health
      - desired_revision
      - applied_revision
      - outstanding_attempts
      - execution_authorized
      - last_heartbeat_at
      - configuration_digest
    CommandRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          enum:
          - START
          - PAUSE
          - RESUME
          - STOP
          - DISARM
        expected_revision: *id008
        reason:
          type: string
          maxLength: 500
      required:
      - action
      - expected_revision
    CommandReceipt:
      type: object
      additionalProperties: false
      properties:
        command_id:
          type: string
        session_id:
          type: string
        revision: *id008
        status:
          enum:
          - PENDING
          - APPLIED
          - REJECTED
          - SUPERSEDED
        action:
          enum:
          - START
          - PAUSE
          - RESUME
          - STOP
          - DISARM
        accepted_at:
          type: string
          format: date-time
        applied_at:
          type:
          - string
          - 'null'
          format: date-time
        outstanding_attempts:
          type: integer
          minimum: 0
        fence_effective:
          type: boolean
        signer_revocation_status:
          type: string
          enum:
          - NOT_APPLICABLE
          - PENDING
          - ACKNOWLEDGED
      required:
      - command_id
      - session_id
      - revision
      - status
      - action
      - accepted_at
      - applied_at
      - outstanding_attempts
      - fence_effective
      - signer_revocation_status
      description: APPLIED STOP/PAUSE means worker fence effective. APPLIED DISARM also requires durable
        signer epoch revocation acknowledgement; unreachable signer retains PENDING command status.
    Opportunity:
      $ref: ./opportunity.schema.json
    CreateSession:
      type: object
      additionalProperties: false
      properties:
        network_id: *id007
        mode: *id009
        configuration_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        experiment_id:
          type: string
          minLength: 1
          maxLength: 128
        strategy_ids:
          type: array
          minItems: 1
          items:
            type: string
          maxItems: 16
      required:
      - network_id
      - mode
      - configuration_digest
      - experiment_id
      - strategy_ids
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        operator_id:
          const: operator
        csrf_token:
          type: string
          pattern: ^[0-9a-f]{64}$
        expires_at:
          type: string
          pattern: ^[0-9]+$
          description: Unix epoch seconds, encoded as a decimal string.
      required:
      - operator_id
      - csrf_token
      - expires_at
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        operator_secret:
          type: string
          minLength: 32
          maxLength: 1024
          writeOnly: true
      required:
      - operator_secret
    RegisteredConfiguration:
      type: object
      additionalProperties: false
      properties:
        configuration_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        mode:
          enum:
          - OBSERVE
          - PAPER
          - REPLAY
        enabled_networks:
          type: array
          items:
            enum:
            - base-mainnet
            - solana-mainnet
        strategy_ids:
          type: array
          items:
            type: string
      required:
      - configuration_digest
      - mode
      - enabled_networks
      - strategy_ids
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        modes:
          type: array
          items:
            enum:
            - OBSERVE
            - PAPER
            - REPLAY
        live_execution:
          const: false
        market_data:
          const: false
        opportunity_capture:
          const: false
        command_application:
          const: WORKER_ACK_REQUIRED
        registered_configurations:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredConfiguration'
      required:
      - modes
      - live_execution
      - market_data
      - opportunity_capture
      - command_application
      - registered_configurations
