[package]
name = "arb-solana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arb-adapter-api = { path = "../arb-adapter-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
base64 = { version = "0.23", default-features = false, features = ["std"] }
bs58 = "0.5"

# Pin both historical Apache-2.0 packages; newer releases use different terms.
orca_whirlpools_core = { version = "=1.0.4", default-features = false }
orca_whirlpools_macros = "=1.0.4"
