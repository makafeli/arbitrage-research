[package]
name = "control-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["json", "query"] }
tokio = { workspace = true, features = ["sync", "time"] }
arb-storage = { path = "../../crates/arb-storage" }
arb-config = { path = "../../crates/arb-config" }
arb-domain.workspace = true
arb-engine.workspace = true
arb-registry.workspace = true
arb-paper = { path = "../../crates/arb-paper" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
getrandom = "0.4"
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
arb-control = { path = "../../crates/arb-control" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
